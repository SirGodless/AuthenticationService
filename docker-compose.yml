# Stack für AuthenticationService (Backend) und UserHub (UI).
# Die beiden Repos liegen nebeneinander, die UI wird aus ../UserHub gebaut.
# Keine veröffentlichten Ports: Von außen kommt man nur über Caddy hinein.
name: authservice

services:
  auth-db:
    image: postgres:17.11-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-backend:
    build: .
    image: auth-backend:local
    container_name: auth-backend
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/auth
      DB_USER: auth
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://auth.anfall.net}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY fehlt in .env}
      PASSWORD_PEPPER_KEY: ${PASSWORD_PEPPER_KEY:?PASSWORD_PEPPER_KEY fehlt in .env}
      OIDC_KEY_ENCRYPTION_KEY: ${OIDC_KEY_ENCRYPTION_KEY:?OIDC_KEY_ENCRYPTION_KEY fehlt in .env}
      TOTP_ISSUER: ${TOTP_ISSUER:-anfall.net}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      # Eigener Mailserver (Container "mail"). Zum Entwickeln: MAIL_HOST=mailpit, MAIL_PORT=1025
      MAIL_HOST: ${MAIL_HOST:-mail}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-no-reply@anfall.net}
      # Nur von diesen Adressen wird X-Forwarded-For geglaubt: das Netz von Caddy (docker network inspect caddy_net)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.22.0.0/16}
    # caddy_net: damit Caddy das Backend erreicht. internal: für Datenbank und Mailserver.
    networks: [caddy_net, internal]

  # Eigener Mailserver (Postfix mit DKIM-Signatur), nur zum Versenden. Er hat keine veröffentlichten Ports:
  # Das Backend übergibt Mails intern, der Container liefert sie selbst an die Empfänger aus (ausgehend Port 25).
  # Was dafür auf dem Server und im DNS nötig ist, steht in README.md (Abschnitt "Mailserver").
  mail:
    # Festgenagelt per Digest (boky/postfix, Stand 12.11.2026)
    image: boky/postfix@sha256:0632783c64183446c4edeae9092a2e015fdc0c4e8a3976bdf8878a7fc2146361
    container_name: auth-mail
    restart: unless-stopped
    environment:
      # Nur Mails mit dieser Absender-Domain werden angenommen und signiert
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-anfall.net}
      # Muss zum DNS-Eintrag (A) und zum rDNS (PTR) der Server-IP passen
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-mail.anfall.net}
      DKIM_AUTOGENERATE: "1"
      DKIM_SELECTOR: mail
      # Es gibt keinen Posteingang. Rückläufer (Bounces) gehen an die Absenderadresse und werden dort verworfen.
      # Gescheiterte Zustellungen sieht man im Log: docker compose logs mail | grep status=bounced
      POSTFIX_transport_maps: "inline:{ { ${MAIL_FROM:-no-reply@anfall.net} = discard:bounces-not-collected } }"
    volumes:
      # DKIM-Schlüssel: Müssen erhalten bleiben, sonst passt der DNS-Eintrag nicht mehr
      - mail-dkim:/var/lib/rspamd/dkim
      # Warteschlange: Mails überleben einen Neustart
      - mail-spool:/var/spool/postfix
    # internal: Backend erreicht den Server. mail_out: Zugang nach draußen zum Ausliefern.
    networks: [internal, mail_out]

  userhub-ui:
    build: ../UserHub
    image: userhub-ui:local
    container_name: userhub-ui
    restart: unless-stopped
    networks: [caddy_net]

  # Nur Entwicklung: docker compose --profile dev up -d --build
  mailpit:
    image: axllent/mailpit:v1.29.7
    container_name: mailpit
    profiles: [dev]
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  auth-db-data:
  mail-dkim:
  mail-spool:

networks:
  # Gehört zu Caddy und existiert schon auf dem Server (Annahme, siehe docs/DECISIONS.md)
  caddy_net:
    external: true
  # Nur intern: kein Zugang von außen
  internal:
    internal: true
  # Nur für den Mailserver: normaler Zugang nach draußen (Auslieferung per SMTP). Keine Ports veröffentlicht.
  mail_out:
