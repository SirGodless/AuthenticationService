# Mail-Texte, Englisch (Standard). Platzhalter: %1$s = Username, %2$s = Link.
confirm_email.subject=Confirm your email address
confirm_email.body=Hello %1$s,\n\nplease confirm your email address by opening this link:\n\n%2$s\n\nThe link works once and expires in 24 hours. If you did not expect this email, you can ignore it.
password_reset.subject=Reset your password
password_reset.body=Hello %1$s,\n\nsomeone asked to reset the password of your account. To choose a new password, open this link:\n\n%2$s\n\nThe link works once and expires in 1 hour. Resetting the password signs you out everywhere. If you did not ask for this, you can ignore this email, your password stays as it is.
