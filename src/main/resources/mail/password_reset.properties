# Mail-Text, Englisch (Standard). Platzhalter: %1$s = Username, %2$s = Link.
subject=Reset your password
body=Hello %1$s,\n\nsomeone asked to reset the password of your account. To choose a new password, open this link:\n\n%2$s\n\nThe link works once and expires in 1 hour. Resetting the password signs you out everywhere. If you did not ask for this, you can ignore this email, your password stays as it is.
