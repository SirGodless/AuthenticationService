# Mail-Text, Deutsch. Platzhalter: %1$s = Username, %2$s = Link.
subject=Passwort zurücksetzen
body=Hallo %1$s,\n\njemand hat angefordert, das Passwort deines Kontos zurückzusetzen. Um ein neues Passwort zu wählen, öffne diesen Link:\n\n%2$s\n\nDer Link funktioniert nur einmal und läuft nach 1 Stunde ab. Das Zurücksetzen meldet dich überall ab. Wenn du das nicht angefordert hast, ignoriere diese Mail, dein Passwort bleibt wie es ist.
