# Mail-Text, Englisch (Standard). Platzhalter: %1$s = Username, %2$s = Link.
subject=Please choose a new password
body=Hello %1$s,\n\nan administrator asked for a password change on your account, for example because your password may have been exposed. You were signed out everywhere and the old password no longer works. To choose a new password, open this link:\n\n%2$s\n\nThe link works once and expires in 1 hour. If it has expired, use "Forgot your password?" on the sign-in page.
