# Mail-Text, Deutsch. Platzhalter: %1$s = Username, %2$s = Link.
subject=Bitte wähle ein neues Passwort
body=Hallo %1$s,\n\nein Administrator hat für dein Konto einen Passwortwechsel angefordert, zum Beispiel weil dein Passwort bekannt geworden sein könnte. Du wurdest überall abgemeldet und das alte Passwort gilt nicht mehr. Um ein neues Passwort zu wählen, öffne diesen Link:\n\n%2$s\n\nDer Link funktioniert nur einmal und läuft nach 1 Stunde ab. Ist er abgelaufen, nutze auf der Anmeldeseite "Passwort vergessen?".
