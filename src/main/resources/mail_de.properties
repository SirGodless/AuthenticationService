# Mail-Texte, Deutsch. Platzhalter: %1$s = Username, %2$s = Link.
confirm_email.subject=Bestätige deine E-Mail-Adresse
confirm_email.body=Hallo %1$s,\n\nbitte bestätige deine E-Mail-Adresse, indem du diesen Link öffnest:\n\n%2$s\n\nDer Link funktioniert nur einmal und läuft nach 24 Stunden ab. Wenn du diese Mail nicht erwartet hast, kannst du sie ignorieren.
password_reset.subject=Passwort zurücksetzen
password_reset.body=Hallo %1$s,\n\njemand hat angefordert, das Passwort deines Kontos zurückzusetzen. Um ein neues Passwort zu wählen, öffne diesen Link:\n\n%2$s\n\nDer Link funktioniert nur einmal und läuft nach 1 Stunde ab. Das Zurücksetzen meldet dich überall ab. Wenn du das nicht angefordert hast, ignoriere diese Mail, dein Passwort bleibt wie es ist.
